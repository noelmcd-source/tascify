<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tascify</title>
<link rel="icon" type="image/png" href="assets/mark-primary.png">
<style>
  :root { --teal:#0096A6; --navy:#111827; --muted:#5b6b74; --line:#e6edf0; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         color:var(--navy); background:#fff; }
  header { background:var(--teal); color:#fff; padding:56px 20px; text-align:center; }
  .wrap { max-width:640px; margin:0 auto; padding:0 20px; }
  h1 { margin:0 0 8px; font-size:36px; letter-spacing:-.5px; }
  header p { margin:0; opacity:.94; font-size:17px; }
  main { padding:40px 0 60px; }
  .links { display:grid; gap:14px; margin-top:8px; }
  .link { display:block; text-decoration:none; color:inherit; border:1px solid var(--line);
          border-radius:14px; padding:18px 20px; }
  .link:hover { border-color:var(--teal); }
  .link strong { display:block; color:var(--teal); font-size:17px; margin-bottom:2px; }
  .link span { color:var(--muted); font-size:14.5px; }
  footer { border-top:1px solid var(--line); margin-top:36px; padding:24px 0 60px;
           color:var(--muted); font-size:14px; text-align:center; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="assets/mark-white.png" alt="" width="96" height="96"
         style="display:block; margin:0 auto 14px;">
    <h1>Tascify</h1>
    <p>Kids earn their screen time. Nothing about them leaves their phone.</p>
    <a href="https://apps.apple.com/ie/app/tascify-private-screen-time/id6787518824"
       style="display:inline-block; margin-top:18px; background:#fff; color:var(--teal);
              font-weight:700; text-decoration:none; padding:12px 26px; border-radius:999px;">
      Download on the App&nbsp;Store</a>
  </div>
</header>

<main class="wrap">
  <div class="links">
    <a class="link" href="privacy/">
      <strong>Privacy Policy</strong>
      <span>What we collect, what we never collect, and your rights.</span>
    </a>
    <a class="link" href="support/">
      <strong>Support</strong>
      <span>Setup help, common questions, and how to reach me directly.</span>
    </a>
  </div>
  <footer>Made in Cork, Ireland · <a href="mailto:hello@tascify.ie" style="color:var(--teal)">hello@tascify.ie</a></footer>
</main>
</body>
</html>
